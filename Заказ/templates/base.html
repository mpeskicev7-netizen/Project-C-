<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "{{ url_for('static' , filename='css/main.css')}}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <header>
    <div class="container">
        <a href="/" class="logo">📦 ТК.рф</a>
        <div class = "auth-buttons">
            {% if current_user.is_authenticated %}
            <span class="auth-greeting">Привет, {{ current_user.name }}</span>
            <a href="{{ url_for('account') }}" class="btn btn--secondary">Личный кабинет</a>
            <a href="{{ url_for('logout') }}" class="btn btn--secondary">Выйти</a>
            {% else %}
             <a href="{{ url_for('login') }}" class="btn btn--secondary">Войти</a>
             <a href="{{ url_for('register') }}" class="btn btn--primary">Регистрация</a>
            {% endif %}
        </div>
    </div>
</header>
	{% block body %}{% endblock %}
</body>
</html>
